plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // Misma firma que La Bóveda y el resto de la Suite: keystore compartido de Fusión
    // (apk-build/debug.keystore). Es lo que hace que el permiso de firma del puente 🔑 se conceda.
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace 'com.vigia.tecladosoberano'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.tecladosoberano"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "v15.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Política de dependencias: solo librerías locales, sin red, analítica ni nube.
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
